<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Painel KevenZL Pix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #25103b 0%,
          #0b0812 55%,
          #050507 100%
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: #bdb4c8;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 20px;
    }

    .card {
      background:
        rgba(
          18,
          14,
          26,
          0.92
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 10px 30px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .grupo {
      margin-bottom: 20px;
    }

    .grupo label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .linha {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
    }

    input[type="number"],
    select {
      width: 100%;

      background:
        #0f0c14;

      color: white;

      border:
        1px solid
        #40344c;

      border-radius: 10px;

      padding: 12px;

      outline: none;
    }

    .valor {
      min-width: 60px;

      text-align: right;

      color:
        #d9c5ff;

      font-weight: 800;
    }

    .switch-row {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 20px;

      margin-bottom: 16px;
    }

    .switch-row span {
      font-weight: 700;
    }

    .switch {
      position: relative;

      width: 54px;
      height: 30px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;

      inset: 0;

      background:
        #40394a;

      border-radius:
        999px;

      cursor: pointer;

      transition:
        0.2s;
    }

    .slider::before {
      content: "";

      position: absolute;

      width: 22px;
      height: 22px;

      top: 4px;
      left: 4px;

      border-radius: 50%;

      background:
        white;

      transition:
        0.2s;
    }

    .switch input:checked +
    .slider {
      background:
        #a84dff;
    }

    .switch input:checked +
    .slider::before {
      transform:
        translateX(
          24px
        );
    }

    .tiers {
      display: grid;

      grid-template-columns:
        repeat(
          5,
          1fr
        );

      gap: 12px;

      margin-top: 16px;
    }

    .tier {
      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      border-radius:
        14px;

      padding: 14px;

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );
    }

    .tier strong {
      display: block;
      margin-bottom: 8px;
    }

    .tier small {
      display: block;

      color:
        #aaa1b5;

      margin-bottom:
        10px;
    }

    button {
      border: none;

      border-radius:
        10px;

      padding:
        12px 16px;

      font-weight:
        800;

      cursor: pointer;

      transition:
        0.2s;
    }

    button:hover {
      transform:
        translateY(
          -1px
        );
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #9d3cff,
          #e24cff
        );

      color: white;
    }

    .btn-secundario {
      background:
        #211a29;

      color: white;

      border:
        1px solid
        #493d59;
    }

    .acoes {
      display: flex;

      gap: 12px;

      margin-top:
        24px;

      flex-wrap:
        wrap;
    }

    .status {
      margin-top:
        18px;

      padding:
        12px;

      border-radius:
        10px;

      display: none;
    }

    .status.ok {
      display: block;

      background:
        rgba(
          52,
          211,
          153,
          0.14
        );

      border:
        1px solid
        rgba(
          52,
          211,
          153,
          0.35
        );

      color:
        #8bf0c5;
    }

    .status.erro {
      display: block;

      background:
        rgba(
          239,
          68,
          68,
          0.14
        );

      border:
        1px solid
        rgba(
          239,
          68,
          68,
          0.35
        );

      color:
        #ff9d9d;
    }

    .status.carregando {
      display: block;

      background:
        rgba(
          168,
          77,
          255,
          0.12
        );

      border:
        1px solid
        rgba(
          168,
          77,
          255,
          0.35
        );

      color:
        #d7b7ff;
    }

    .teste-grid {
      display: grid;

      grid-template-columns:
        repeat(
          5,
          1fr
        );

      gap: 12px;
    }

    .teste-grid button {
      min-height: 58px;
    }

    .basic {
      border-color:
        #555;
    }

    .medium {
      border-color:
        #ad39ff;
    }

    .epic {
      border-color:
        #586cff;
    }

    .special {
      border-color:
        #e69b00;
    }

    .legendary {
      border-color:
        #ff263d;
    }

    @media (
      max-width: 900px
    ) {

      .grid {
        grid-template-columns:
          1fr;
      }

      .tiers,
      .teste-grid {
        grid-template-columns:
          1fr 1fr;
      }

    }

    @media (
      max-width: 560px
    ) {

      body {
        padding: 16px;
      }

      .tiers,
      .teste-grid {
        grid-template-columns:
          1fr;
      }

    }
  </style>
</head>


<body>

          <option

          <option
            value="/sounds/especial.mp3"

<script>

const campos = {

  volumeMeme:
    document.getElementById(
      "volumeMeme"
    ),

  volumeVoz:
    document.getElementById(
      "volumeVoz"
    ),

  memesAtivos:
    document.getElementById(
      "memesAtivos"
    ),

  vozAtiva:
    document.getElementById(
      "vozAtiva"
    ),

  duracao:
    document.getElementById(
      "duracao"
    ),

  flashAtivo:
    document.getElementById(
      "flashAtivo"
    ),

  particulasAtivas:
    document.getElementById(
      "particulasAtivas"
    ),

  somBasic:
    document.getElementById(
      "somBasic"
    ),

  somMedium:
    document.getElementById(
      "somMedium"
    ),

  somEpic:
    document.getElementById(
      "somEpic"
    ),

  somSpecial:
    document.getElementById(
      "somSpecial"
    ),

  somLegendary:
    document.getElementById(
      "somLegendary"
    )

};


const volumeMemeValor =
  document.getElementById(
    "volumeMemeValor"
  );


const volumeVozValor =
  document.getElementById(
    "volumeVozValor"
  );


const statusEl =
  document.getElementById(
    "status"
  );


// =====================================
// SLIDERS
// =====================================

campos.volumeMeme
  .addEventListener(
    "input",
    () => {

      volumeMemeValor.textContent =
        campos.volumeMeme.value +
        "%";

    }
  );


campos.volumeVoz
  .addEventListener(
    "input",
    () => {

      volumeVozValor.textContent =
        campos.volumeVoz.value +
        "%";

    }
  );


// =====================================
// OBTER CONFIGURAÇÃO DA TELA
// =====================================

function obterConfiguracoes() {

  return {

    volumeMeme:

      Number(
        campos.volumeMeme.value
      ) / 100,


    volumeVoz:

      Number(
        campos.volumeVoz.value
      ) / 100,


    memesAtivos:

      campos
        .memesAtivos
        .checked,


    vozAtiva:

      campos
        .vozAtiva
        .checked,


    duracao:

      Number(
        campos.duracao.value
      ),


    flashAtivo:

      campos
        .flashAtivo
        .checked,


    particulasAtivas:

      campos
        .particulasAtivas
        .checked,


    sons: {

      basic:
        campos
          .somBasic
          .value,

      medium:
        campos
          .somMedium
          .value,

      epic:
        campos
          .somEpic
          .value,

      special:
        campos
          .somSpecial
          .value,

      legendary:
        campos
          .somLegendary
          .value

    }

  };

}


// =====================================
// COLOCAR CONFIG NA TELA
// =====================================

function aplicarConfiguracoes(
  config
) {

  campos.volumeMeme.value =
    Math.round(
      (
        config.volumeMeme ??
        1
      ) *
      100
    );


  campos.volumeVoz.value =
    Math.round(
      (
        config.volumeVoz ??
        1
      ) *
      100
    );


  campos.memesAtivos.checked =
    config.memesAtivos !==
    false;


  campos.vozAtiva.checked =
    config.vozAtiva !==
    false;


  campos.duracao.value =
    config.duracao ??
    12;


  campos.flashAtivo.checked =
    config.flashAtivo !==
    false;


  campos.particulasAtivas.checked =
    config.particulasAtivas !==
    false;


  if (
    config.sons
  ) {

    campos.somBasic.value =
      config.sons.basic ||
      "/sounds/basico.mp3";


    campos.somMedium.value =
      config.sons.medium ||
      "/sounds/medio.mp3";


    campos.somEpic.value =
      config.sons.epic ||
      "/sounds/epico.mp3";


    campos.somSpecial.value =
      config.sons.special ||
      "/sounds/especial.mp3";


    campos.somLegendary.value =
      config.sons.legendary ||
      "/sounds/lendario.mp3";

  }


  volumeMemeValor.textContent =
    campos.volumeMeme.value +
    "%";


  volumeVozValor.textContent =
    campos.volumeVoz.value +
    "%";

}


// =====================================
// STATUS
// =====================================

function mostrarStatus(
  texto,
  tipo = "ok"
) {

  statusEl.textContent =
    texto;


  statusEl.className =
    "status " +
    tipo;

}


// =====================================
// CARREGAR CONFIG DO SERVIDOR
// =====================================

async function carregarConfiguracoes() {

  mostrarStatus(
    "Carregando configurações...",
    "carregando"
  );


  try {

    const response =
      await fetch(
        "/api/config",
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Servidor respondeu " +
        response.status
      );

    }


    const config =
      await response.json();


    aplicarConfiguracoes(
      config
    );


    mostrarStatus(
      "✅ Configurações carregadas do servidor.",
      "ok"
    );


  } catch (error) {

    console.error(
      error
    );


    mostrarStatus(
      "❌ Não foi possível carregar as configurações.",
      "erro"
    );

  }

}


// =====================================
// SALVAR NO SERVIDOR
// =====================================

async function salvarConfiguracoes(
  mostrarMensagem = true
) {

  const config =
    obterConfiguracoes();


  try {

    if (
      mostrarMensagem
    ) {

      mostrarStatus(
        "Salvando configurações...",
        "carregando"
      );

    }


    const response =
      await fetch(

        "/api/config",

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              config
            )

        }

      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(

        data.error ||
        "Erro ao salvar"

      );

    }


    if (
      mostrarMensagem
    ) {

      mostrarStatus(
        "✅ Configurações salvas no servidor!",
        "ok"
      );

    }


    return true;


  } catch (error) {

    console.error(
      error
    );


    mostrarStatus(
      "❌ Erro ao salvar configurações.",
      "erro"
    );


    return false;

  }

}


// =====================================
// TESTAR ALERTA
// =====================================

async function testar(
  tier,
  botao
) {

  const textoOriginal =
    botao.textContent;


  botao.disabled =
    true;


  botao.textContent =
    "Enviando...";


  mostrarStatus(
    "Preparando alerta de teste...",
    "carregando"
  );


  try {

    // Primeiro salva as configurações
    // atuais do painel.

    const salvo =
      await salvarConfiguracoes(
        false
      );


    if (
      !salvo
    ) {

      throw new Error(
        "Não foi possível salvar a configuração."
      );

    }


    const response =
      await fetch(

        "/api/test-alert",

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              tier

            })

        }

      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(

        data.error ||
        "Erro no teste"

      );

    }


    mostrarStatus(
      "✅ Alerta enviado! Veja o Streamlabs.",
      "ok"
    );


  } catch (error) {

    console.error(
      error
    );


    mostrarStatus(
      "❌ Não foi possível enviar o alerta de teste.",
      "erro"
    );

  } finally {

    botao.disabled =
      false;


    botao.textContent =
      textoOriginal;

  }

}


// =====================================
// RECARREGAR CONFIGURAÇÕES
// =====================================

function recarregarConfiguracoes() {

  carregarConfiguracoes();

}


// =====================================
// RESTAURAR PADRÃO
// =====================================

async function restaurarPadrao() {

  campos.volumeMeme.value =
    100;

  campos.volumeVoz.value =
    100;

  campos.memesAtivos.checked =
    true;

  campos.vozAtiva.checked =
    true;

  campos.duracao.value =
    12;

  campos.flashAtivo.checked =
    true;

  campos.particulasAtivas.checked =
    true;

  campos.somBasic.value =
    "/sounds/basico.mp3";

  campos.somMedium.value =
    "/sounds/medio.mp3";

  campos.somEpic.value =
    "/sounds/epico.mp3";

  campos.somSpecial.value =
    "/sounds/especial.mp3";

  campos.somLegendary.value =
    "/sounds/lendario.mp3";


  volumeMemeValor.textContent =
    "100%";


  volumeVozValor.textContent =
    "100%";


  await salvarConfiguracoes();


  mostrarStatus(
    "✅ Configurações padrão restauradas.",
    "ok"
  );

}


// =====================================
// INICIAR
// =====================================

carregarConfiguracoes();

</script>
