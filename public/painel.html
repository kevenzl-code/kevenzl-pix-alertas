<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Painel KevenZL Pix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #25103b 0%, #0b0812 55%, #050507 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: #bdb4c8;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(18, 14, 26, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .grupo {
      margin-bottom: 20px;
    }

    .grupo label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .linha {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
    }

    input[type="number"],
    select {
      width: 100%;
      background: #0f0c14;
      color: white;
      border: 1px solid #40344c;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .valor {
      min-width: 60px;
      text-align: right;
      color: #d9c5ff;
      font-weight: 800;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .switch-row span {
      font-weight: 700;
    }

    .switch {
      position: relative;
      width: 54px;
      height: 30px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #40394a;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      top: 4px;
      left: 4px;
      border-radius: 50%;
      background: white;
      transition: .2s;
    }

    .switch input:checked + .slider {
      background: #a84dff;
    }

    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }

    .tiers {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .tier {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255,255,255,0.025);
    }

    .tier strong {
      display: block;
      margin-bottom: 8px;
    }

    .tier small {
      color: #aaa1b5;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #9d3cff, #e24cff);
      color: white;
    }

    .btn-secundario {
      background: #211a29;
      color: white;
      border: 1px solid #493d59;
    }

    .acoes {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .status.ok {
      display: block;
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #8bf0c5;
    }

    .status.erro {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #ff9d9d;
    }

    .teste-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .teste-grid button {
      min-height: 58px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .tiers,
      .teste-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .tiers,
      .teste-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Painel de Alertas KevenZL</h1>
  <div class="subtitulo">
    Controle dos alertas Pix da live
  </div>


  <div class="grid">

    <div class="card">
      <h2>Áudio</h2>

      <div class="grupo">
        <label>Volume do meme</label>

        <div class="linha">
          <input
            id="volumeMeme"
            type="range"
            min="0"
            max="100"
            value="100"
          />

          <div
            id="volumeMemeValor"
            class="valor"
          >
            100%
          </div>
        </div>
      </div>


      <div class="grupo">
        <label>Volume da voz IA</label>

        <div class="linha">
          <input
            id="volumeVoz"
            type="range"
            min="0"
            max="100"
            value="100"
          />

          <div
            id="volumeVozValor"
            class="valor"
          >
            100%
          </div>
        </div>
      </div>


      <div class="switch-row">
        <span>Tocar memes</span>

        <label class="switch">
          <input
            id="memesAtivos"
            type="checkbox"
            checked
          />

          <span class="slider"></span>
        </label>
      </div>


      <div class="switch-row">
        <span>Voz da IA</span>

        <label class="switch">
          <input
            id="vozAtiva"
            type="checkbox"
            checked
          />

          <span class="slider"></span>
        </label>
      </div>
    </div>


    <div class="card">
      <h2>Tempo e efeitos</h2>

      <div class="grupo">
        <label>
          Tempo mínimo do alerta
        </label>

        <div class="linha">

          <input
            id="duracao"
            type="number"
            min="3"
            max="60"
            value="12"
          />

          <span>segundos</span>

        </div>
      </div>


      <div class="switch-row">
        <span>Flash de entrada</span>

        <label class="switch">
          <input
            id="flashAtivo"
            type="checkbox"
            checked
          />

          <span class="slider"></span>
        </label>
      </div>


      <div class="switch-row">
        <span>Partículas</span>

        <label class="switch">
          <input
            id="particulasAtivas"
            type="checkbox"
            checked
          />

          <span class="slider"></span>
        </label>
      </div>
    </div>

  </div>


  <div class="card" style="margin-top:20px;">
    <h2>Sons por faixa</h2>

    <div class="tiers">

      <div class="tier">
        <strong>Básico</strong>
        <small>R$1–9,99</small>

        <select id="somBasic">
          <option value="/sounds/basico.mp3">
            basico.mp3
          </option>

          <option value="/sounds/medio.mp3">
            medio.mp3
          </option>

          <option value="/sounds/epico.mp3">
            epico.mp3
          </option>

          <option value="/sounds/especial.mp3">
            especial.mp3
          </option>

          <option value="/sounds/lendario.mp3">
            lendario.mp3
          </option>
        </select>
      </div>


      <div class="tier">
        <strong>Destacado</strong>
        <small>R$10–24,99</small>

        <select id="somMedium">
          <option value="/sounds/basico.mp3">
            basico.mp3
          </option>

          <option
            value="/sounds/medio.mp3"
            selected
          >
            medio.mp3
          </option>

          <option value="/sounds/epico.mp3">
            epico.mp3
          </option>

          <option value="/sounds/especial.mp3">
            especial.mp3
          </option>

          <option value="/sounds/lendario.mp3">
            lendario.mp3
          </option>
        </select>
      </div>


      <div class="tier">
        <strong>Épico</strong>
        <small>R$25–49,99</small>

        <select id="somEpic">
          <option value="/sounds/basico.mp3">
            basico.mp3
          </option>

          <option value="/sounds/medio.mp3">
            medio.mp3
          </option>

          <option
            value="/sounds/epico.mp3"
            selected
          >
            epico.mp3
          </option>

          <option value="/sounds/especial.mp3">
            especial.mp3
          </option>

          <option value="/sounds/lendario.mp3">
            lendario.mp3
          </option>
        </select>
      </div>


      <div class="tier">
        <strong>Especial</strong>
        <small>R$50–99,99</small>

        <select id="somSpecial">
          <option value="/sounds/basico.mp3">
            basico.mp3
          </option>

          <option value="/sounds/medio.mp3">
            medio.mp3
          </option>

          <option value="/sounds/epico.mp3">
            epico.mp3
          </option>

          <option
            value="/sounds/especial.mp3"
            selected
          >
            especial.mp3
          </option>

          <option value="/sounds/lendario.mp3">
            lendario.mp3
          </option>
        </select>
      </div>


      <div class="tier">
        <strong>Lendário</strong>
        <small>R$100+</small>

        <select id="somLegendary">
          <option value="/sounds/basico.mp3">
            basico.mp3
          </option>

          <option value="/sounds/medio.mp3">
            medio.mp3
          </option>

          <option value="/sounds/epico.mp3">
            epico.mp3
          </option>

          <option value="/sounds/especial.mp3">
            especial.mp3
          </option>

          <option
            value="/sounds/lendario.mp3"
            selected
          >
            lendario.mp3
          </option>
        </select>
      </div>

    </div>
  </div>


  <div class="card" style="margin-top:20px;">

    <h2>Testar alertas</h2>

    <div class="teste-grid">

      <button
        class="btn-secundario"
        onclick="testar('basic')"
      >
        Testar R$5
      </button>

      <button
        class="btn-secundario"
        onclick="testar('medium')"
      >
        Testar R$15
      </button>

      <button
        class="btn-secundario"
        onclick="testar('epic')"
      >
        Testar R$30
      </button>

      <button
        class="btn-secundario"
        onclick="testar('special')"
      >
        Testar R$50
      </button>

      <button
        class="btn-secundario"
        onclick="testar('legendary')"
      >
        Testar R$100
      </button>

    </div>


    <div class="acoes">

      <button
        class="btn-primary"
        onclick="salvarConfiguracoes()"
      >
        Salvar configurações
      </button>

      <button
        class="btn-secundario"
        onclick="restaurarPadrao()"
      >
        Restaurar padrão
      </button>

    </div>


    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>


<script>

  const campos = {
    volumeMeme:
      document.getElementById("volumeMeme"),

    volumeVoz:
      document.getElementById("volumeVoz"),

    memesAtivos:
      document.getElementById("memesAtivos"),

    vozAtiva:
      document.getElementById("vozAtiva"),

    duracao:
      document.getElementById("duracao"),

    flashAtivo:
      document.getElementById("flashAtivo"),

    particulasAtivas:
      document.getElementById("particulasAtivas"),

    somBasic:
      document.getElementById("somBasic"),

    somMedium:
      document.getElementById("somMedium"),

    somEpic:
      document.getElementById("somEpic"),

    somSpecial:
      document.getElementById("somSpecial"),

    somLegendary:
      document.getElementById("somLegendary")
  };


  const volumeMemeValor =
    document.getElementById(
      "volumeMemeValor"
    );


  const volumeVozValor =
    document.getElementById(
      "volumeVozValor"
    );


  campos.volumeMeme.addEventListener(
    "input",
    () => {

      volumeMemeValor.textContent =
        campos.volumeMeme.value + "%";

    }
  );


  campos.volumeVoz.addEventListener(
    "input",
    () => {

      volumeVozValor.textContent =
        campos.volumeVoz.value + "%";

    }
  );


  function obterConfiguracoes() {

    return {

      volumeMeme:
        Number(
          campos.volumeMeme.value
        ) / 100,

      volumeVoz:
        Number(
          campos.volumeVoz.value
        ) / 100,

      memesAtivos:
        campos.memesAtivos.checked,

      vozAtiva:
        campos.vozAtiva.checked,

      duracao:
        Number(
          campos.duracao.value
        ),

      flashAtivo:
        campos.flashAtivo.checked,

      particulasAtivas:
        campos.particulasAtivas.checked,

      sons: {

        basic:
          campos.somBasic.value,

        medium:
          campos.somMedium.value,

        epic:
          campos.somEpic.value,

        special:
          campos.somSpecial.value,

        legendary:
          campos.somLegendary.value
      }
    };
  }


  function salvarConfiguracoes() {

    const config =
      obterConfiguracoes();


    localStorage.setItem(
      "kevenzlAlertConfig",
      JSON.stringify(config)
    );


    mostrarStatus(
      "Configurações salvas neste navegador.",
      true
    );
  }


  function carregarConfiguracoes() {

    const salvo =
      localStorage.getItem(
        "kevenzlAlertConfig"
      );


    if (!salvo) {
      return;
    }


    try {

      const config =
        JSON.parse(salvo);


      campos.volumeMeme.value =
        Math.round(
          (config.volumeMeme ?? 1) * 100
        );


      campos.volumeVoz.value =
        Math.round(
          (config.volumeVoz ?? 1) * 100
        );


      campos.memesAtivos.checked =
        config.memesAtivos !== false;


      campos.vozAtiva.checked =
        config.vozAtiva !== false;


      campos.duracao.value =
        config.duracao ?? 12;


      campos.flashAtivo.checked =
        config.flashAtivo !== false;


      campos.particulasAtivas.checked =
        config.particulasAtivas !== false;


      if (config.sons) {

        campos.somBasic.value =
          config.sons.basic ||
          "/sounds/basico.mp3";


        campos.somMedium.value =
          config.sons.medium ||
          "/sounds/medio.mp3";


        campos.somEpic.value =
          config.sons.epic ||
          "/sounds/epico.mp3";


        campos.somSpecial.value =
          config.sons.special ||
          "/sounds/especial.mp3";


        campos.somLegendary.value =
          config.sons.legendary ||
          "/sounds/lendario.mp3";
      }


      volumeMemeValor.textContent =
        campos.volumeMeme.value + "%";


      volumeVozValor.textContent =
        campos.volumeVoz.value + "%";


    } catch (error) {

      console.error(
        error
      );
    }
  }


  function restaurarPadrao() {

    localStorage.removeItem(
      "kevenzlAlertConfig"
    );


    location.reload();
  }


  function mostrarStatus(
    texto,
    ok
  ) {

    const status =
      document.getElementById(
        "status"
      );


    status.textContent =
      texto;


    status.className =
      ok
        ? "status ok"
        : "status erro";


    setTimeout(
      () => {

        status.className =
          "status";

      },
      3500
    );
  }


  function testar(tier) {

    mostrarStatus(
      "O botão de teste será conectado ao overlay no próximo passo.",
      true
    );


    console.log(
      "Teste solicitado:",
      tier
    );
  }


  carregarConfiguracoes();

</script>

</body>
</html>
