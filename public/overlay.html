<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KevenZL Pix Alertas</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =====================================
   OVERLAY
===================================== */

#overlay {

  position: fixed;

  inset: 0;

  display: flex;

  justify-content: center;

  align-items: flex-start;

  padding-top: 70px;

  pointer-events: none;

}


/* =====================================
   FLASH
===================================== */

#flash {

  position: fixed;

  inset: 0;

  opacity: 0;

  pointer-events: none;

  z-index: 50;

}


#flash.ativo {

  animation:
    flashTela
    0.55s
    ease-out;

}


@keyframes flashTela {

  0% {

    opacity: 0;

  }


  15% {

    opacity: 0.65;

  }


  100% {

    opacity: 0;

  }

}


/* =====================================
   PARTÍCULAS
===================================== */

#particles {

  position: fixed;

  inset: 0;

  overflow: hidden;

  pointer-events: none;

  z-index: 1;

}


.particula {

  position: absolute;

  width: 6px;

  height: 6px;

  border-radius: 50%;

  background:
    var(--particle-color);

  box-shadow:

    0 0 10px
    var(--particle-color),

    0 0 20px
    var(--particle-color);


  animation:

    subirParticula
    2.3s
    linear
    forwards;

}


@keyframes subirParticula {

  0% {

    transform:
      translateY(0)
      scale(0.4);

    opacity: 0;

  }


  20% {

    opacity: 1;

  }


  100% {

    transform:
      translateY(-350px)
      scale(1.4);

    opacity: 0;

  }

}


/* =====================================
   ALERTA
===================================== */

#alerta {

  --cor: #ffffff;

  --glow:
    rgba(
      255,
      255,
      255,
      0.4
    );


  position: relative;


  width: 720px;

  min-height: 210px;


  padding:
    28px
    38px;


  border-radius:
    18px;


  color:
    white;


  background:

    linear-gradient(
      135deg,
      rgba(5,5,10,.98),
      rgba(20,15,28,.96)
    );


  border:

    2px solid
    var(--cor);


  box-shadow:

    0 0 30px
    var(--glow);


  opacity: 0;


  transform:

    translateY(-100px)
    scale(.65);


  overflow:
    visible;


  z-index: 10;

}


/* =====================================
   MOSTRAR
===================================== */

#alerta.mostrar {

  opacity: 1;


  animation:

    entradaBase
    .65s
    cubic-bezier(
      .18,
      .89,
      .32,
      1.4
    )
    forwards;

}


@keyframes entradaBase {

  0% {

    opacity: 0;


    transform:

      translateY(-120px)
      scale(.55);


    filter:

      brightness(3)
      blur(8px);

  }


  60% {

    opacity: 1;


    transform:

      translateY(10px)
      scale(1.06);


    filter:

      brightness(1.6)
      blur(0);

  }


  100% {

    opacity: 1;


    transform:

      translateY(0)
      scale(1);


    filter:

      brightness(1);

  }

}


/* =====================================
   SAÍDA
===================================== */

#alerta.saindo {

  animation:

    saidaAlerta
    .55s
    ease-in
    forwards;

}


@keyframes saidaAlerta {

  0% {

    opacity: 1;


    transform:

      translateY(0)
      scale(1);

  }


  100% {

    opacity: 0;


    transform:

      translateY(-80px)
      scale(.85);


    filter:
      blur(8px);

  }

}


/* =====================================
   FUNDO NEON
===================================== */

#alerta::before {

  content: "";


  position: absolute;

  inset: -50px;


  border-radius:
    40px;


  background:

    radial-gradient(
      circle,
      var(--glow) 0%,
      transparent 65%
    );


  opacity: .25;


  animation:

    respirar
    1.5s
    ease-in-out
    infinite
    alternate;


  pointer-events: none;


  z-index: -1;

}


@keyframes respirar {

  from {

    transform:
      scale(.9);

    opacity: .16;

  }


  to {

    transform:
      scale(1.25);

    opacity: .45;

  }

}


/* =====================================
   LINHA NEON
===================================== */

#alerta::after {

  content: "";


  position: absolute;


  left: 8%;

  right: 8%;

  bottom: 0;


  height: 3px;


  background:

    linear-gradient(
      90deg,
      transparent,
      var(--cor),
      white,
      var(--cor),
      transparent
    );


  box-shadow:

    0 0 15px
    var(--cor),

    0 0 30px
    var(--cor);


  animation:

    linhaNeon
    1s
    ease-in-out
    infinite
    alternate;

}


@keyframes linhaNeon {

  from {

    opacity: .3;

  }


  to {

    opacity: 1;

  }

}


/* =====================================
   CONTEÚDO
===================================== */

.conteudo {

  position: relative;

  z-index: 5;


  display: flex;

  align-items: center;

  gap: 25px;

}


.icone {

  width: 90px;

  height: 90px;


  flex-shrink: 0;


  display: flex;

  align-items: center;

  justify-content: center;


  border-radius: 18px;


  font-size: 48px;


  color:
    var(--cor);


  border:

    1px solid
    var(--cor);


  background:

    rgba(
      0,
      0,
      0,
      .4
    );


  box-shadow:

    0 0 18px
    var(--glow);


  animation:

    iconePulse
    1s
    ease-in-out
    infinite
    alternate;

}


@keyframes iconePulse {

  from {

    transform:
      scale(1);

  }


  to {

    transform:
      scale(1.08);

  }

}


.texto {

  flex: 1;

}


.categoria {

  font-size:
    14px;


  letter-spacing:
    5px;


  font-weight:
    900;


  color:
    var(--cor);


  margin-bottom:
    5px;

}


.titulo {

  font-size:
    15px;


  letter-spacing:
    5px;


  font-weight:
    800;


  color:

    rgba(
      255,
      255,
      255,
      .75
    );


  margin-bottom:
    8px;

}


.nome {

  font-size:
    30px;


  font-weight:
    900;


  text-shadow:

    0 0 15px
    var(--glow);


  margin-bottom:
    4px;

}


.valor {

  color:
    var(--cor);


  font-size:
    34px;


  font-weight:
    900;


  text-shadow:

    0 0 20px
    var(--glow);


  margin-bottom:
    10px;

}


.mensagem {

  font-size:
    21px;


  color:

    rgba(
      255,
      255,
      255,
      .92
    );


  line-height:
    1.3;


  word-break:
    break-word;

}


.kevenzl {

  position:
    absolute;


  right:
    22px;


  bottom:
    10px;


  z-index:
    6;


  font-size:
    15px;


  font-style:
    italic;


  font-weight:
    900;


  letter-spacing:
    2px;


  color:
    var(--cor);


  opacity:
    .85;

}


/* =====================================
   BÁSICO
===================================== */

.basic {

  --cor:
    #ffffff;


  --glow:

    rgba(
      255,
      255,
      255,
      .38
    );


  background:

    linear-gradient(
      135deg,
      rgba(0,0,0,.97),
      rgba(30,30,30,.96)
    );

}


/* =====================================
   DESTACADO
===================================== */

.medium {

  --cor:
    #df43ff;


  --glow:

    rgba(
      220,
      40,
      255,
      .85
    );


  background:

    linear-gradient(
      135deg,
      rgba(20,0,30,.98),
      rgba(50,0,70,.96)
    );

}


/* =====================================
   ÉPICO
===================================== */

.epic {

  --cor:
    #6381ff;


  --glow:

    rgba(
      70,
      80,
      255,
      .95
    );


  background:

    linear-gradient(
      135deg,
      rgba(3,6,28,.98),
      rgba(20,0,45,.96)
    );

}


.epic.mostrar {

  animation:

    entradaEpica
    .7s
    cubic-bezier(
      .15,
      .85,
      .3,
      1.4
    )
    forwards;

}


@keyframes entradaEpica {

  0% {

    opacity: 0;


    transform:

      translateX(-150px)
      scale(.6);

  }


  45% {

    opacity: 1;


    transform:

      translateX(15px)
      scale(1.08);

  }


  55% {

    transform:

      translateX(-7px)
      scale(1.04);

  }


  70% {

    transform:

      translateX(5px)
      scale(1.02);

  }


  100% {

    transform:

      translateX(0)
      scale(1);

  }

}


/* =====================================
   ESPECIAL
===================================== */

.special {

  --cor:
    #ffb300;


  --glow:

    rgba(
      255,
      140,
      0,
      .95
    );


  background:

    linear-gradient(
      135deg,
      rgba(22,10,0,.98),
      rgba(50,18,0,.97)
    );

}


.special.mostrar {

  animation:

    entradaEspecial
    .8s
    cubic-bezier(
      .2,
      .9,
      .3,
      1.4
    )
    forwards;

}


@keyframes entradaEspecial {

  0% {

    opacity: 0;


    transform:

      scale(.2)
      rotate(-3deg);


    filter:
      brightness(4);

  }


  60% {

    opacity: 1;


    transform:

      scale(1.12)
      rotate(1deg);


    filter:
      brightness(1.7);

  }


  100% {

    transform:

      scale(1)
      rotate(0deg);


    filter:
      brightness(1);

  }

}


/* =====================================
   LENDÁRIO
===================================== */

.legendary {

  --cor:
    #ff263d;


  --glow:

    rgba(
      255,
      0,
      35,
      .98
    );


  width:
    880px;


  min-height:
    240px;


  background:

    linear-gradient(
      135deg,
      rgba(12,0,2,.99),
      rgba(65,0,8,.97)
    );


  border:

    3px solid
    #ff263d;

}


.legendary .icone {

  width:
    115px;

  height:
    115px;

  font-size:
    65px;

}


.legendary .nome {

  font-size:
    38px;

}


.legendary .valor {

  font-size:
    46px;

}


.legendary.mostrar {

  animation:

    entradaLendaria
    .95s
    cubic-bezier(
      .15,
      .85,
      .3,
      1.35
    )
    forwards;

}


@keyframes entradaLendaria {

  0% {

    opacity: 0;

    transform:
      scale(.15);

    filter:
      brightness(5);

  }


  45% {

    opacity: 1;

    transform:
      scale(1.15);

  }


  55% {

    transform:

      translateX(-9px)
      scale(1.08);

  }


  62% {

    transform:

      translateX(10px)
      scale(1.06);

  }


  70% {

    transform:

      translateX(-7px)
      scale(1.04);

  }


  78% {

    transform:

      translateX(6px)
      scale(1.02);

  }


  100% {

    transform:

      translateX(0)
      scale(1);

  }

}


/* =====================================
   COROA
===================================== */

#coroa {

  position: absolute;


  left: 50%;

  top: -55px;


  transform:

    translateX(-50%)
    scale(0);


  font-size:
    70px;


  opacity: 0;


  z-index:
    20;


  filter:

    drop-shadow(
      0 0 18px
      #ffd700
    );

}


.legendary #coroa {

  animation:

    coroaEntrada
    .8s
    .35s
    cubic-bezier(
      .2,
      .9,
      .2,
      1.4
    )
    forwards;

}


@keyframes coroaEntrada {

  from {

    opacity: 0;


    transform:

      translateX(-50%)
      translateY(-50px)
      scale(.2)
      rotate(-15deg);

  }


  to {

    opacity: 1;


    transform:

      translateX(-50%)
      translateY(0)
      scale(1)
      rotate(0deg);

  }

}

</style>

</head>


<body>


<div id="flash"></div>

<div id="particles"></div>


<div id="overlay">


  <div id="alerta">


    <div id="coroa">

      👑

    </div>


    <div class="conteudo">


      <div
        id="icone"
        class="icone"
      >

        💰

      </div>


      <div class="texto">


        <div
          id="categoria"
          class="categoria"
        >

          BÁSICO

        </div>


        <div class="titulo">

          NOVO PIX

        </div>


        <div
          id="nome"
          class="nome"
        >

          Keven

        </div>


        <div
          id="valor"
          class="valor"
        >

          R$ 5,00

        </div>


        <div
          id="mensagem"
          class="mensagem"
        >

          Obrigado pelo apoio!

        </div>


      </div>


    </div>


    <div class="kevenzl">

      KEVENZL

    </div>


  </div>


</div>


<script>


// =====================================
// ELEMENTOS
// =====================================

const alerta =
  document.getElementById(
    "alerta"
  );


const nomeEl =
  document.getElementById(
    "nome"
  );


const valorEl =
  document.getElementById(
    "valor"
  );


const mensagemEl =
  document.getElementById(
    "mensagem"
  );


const iconeEl =
  document.getElementById(
    "icone"
  );


const categoriaEl =
  document.getElementById(
    "categoria"
  );


const flash =
  document.getElementById(
    "flash"
  );


const particles =
  document.getElementById(
    "particles"
  );


// =====================================
// ESTADO
// =====================================

let alertaAtual =
  null;


let fila =
  [];


let audioMemeAtual =
  null;


let audioVozAtual =
  null;


let timeoutSeguranca =
  null;


let timeoutFechamento =
  null;


let alertaMostradoEm =
  0;


// =====================================
// CONFIGURAÇÃO PADRÃO
// =====================================

let config = {

  volumeMeme:
    1,

  volumeVoz:
    1,

  memesAtivos:
    true,

  vozAtiva:
    true,

  duracao:
    12,

  flashAtivo:
    true,

  particulasAtivas:
    true,

  sons: {

    basic:
      "/sounds/basico.mp3",

    medium:
      "/sounds/medio.mp3",

    epic:
      "/sounds/epico.mp3",

    special:
      "/sounds/especial.mp3",

    legendary:
      "/sounds/lendario.mp3"

  }

};


const LIMITE_MEME =
  30000;


// =====================================
// APLICAR CONFIGURAÇÕES
// =====================================

function aplicarConfig(
  novaConfig
) {

  if (
    !novaConfig
  ) {

    return;

  }


  config = {

    ...config,

    ...novaConfig,

    sons: {

      ...config.sons,

      ...(
        novaConfig.sons ||
        {}
      )

    }

  };


  if (
    audioMemeAtual
  ) {

    audioMemeAtual.volume =
      Number(
        config.volumeMeme
      );

  }


  if (
    audioVozAtual
  ) {

    audioVozAtual.volume =
      Number(
        config.volumeVoz
      );

  }


  console.log(

    "Configuração aplicada:",

    config

  );

}


// =====================================
// BUSCAR CONFIGURAÇÃO DO SERVIDOR
// =====================================

async function carregarConfig() {

  try {

    const response =
      await fetch(

        "/api/config",

        {

          cache:
            "no-store"

        }

      );


    if (
      !response.ok
    ) {

      return;

    }


    const data =
      await response.json();


    aplicarConfig(
      data
    );


  } catch (error) {

    console.error(

      "Erro ao carregar configuração:",

      error

    );

  }

}


// =====================================
// LIMPAR TEXTO
// =====================================

function limparTexto(
  texto
) {

  if (
    !texto
  ) {

    return "";

  }


  return String(texto)

    .replace(

      /(https?:\/\/[^\s]+)/gi,

      ""

    )

    .replace(

      /\s+/g,

      " "

    )

    .trim()

    .slice(
      0,
      250
    );

}


// =====================================
// CONFIGURAÇÃO VISUAL DOS TIERS
// =====================================

function configuracaoTier(
  tier
) {

  const tiers = {


    basic: {

      icone:
        "💰",

      categoria:
        "BÁSICO",

      flash:
        "rgba(255,255,255,.8)",

      particles:
        "#ffffff",

      quantidade:
        8

    },


    medium: {

      icone:
        "💎",

      categoria:
        "DESTACADO",

      flash:
        "rgba(220,40,255,.65)",

      particles:
        "#e13cff",

      quantidade:
        15

    },


    epic: {

      icone:
        "🔥",

      categoria:
        "ÉPICO",

      flash:
        "rgba(70,90,255,.65)",

      particles:
        "#627cff",

      quantidade:
        22

    },


    special: {

      icone:
        "🏆",

      categoria:
        "ESPECIAL",

      flash:
        "rgba(255,165,0,.75)",

      particles:
        "#ffae00",

      quantidade:
        30

    },


    legendary: {

      icone:
        "👑",

      categoria:
        "LENDÁRIO",

      flash:
        "rgba(255,0,30,.85)",

      particles:
        "#ff263d",

      quantidade:
        55

    }

  };


  return (
    tiers[tier] ||
    tiers.basic
  );

}


// =====================================
// FLASH
// =====================================

function efeitoFlash(
  cor
) {

  if (
    !config.flashAtivo
  ) {

    return;

  }


  flash.style.background =
    cor;


  flash.classList.remove(
    "ativo"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "ativo"
  );

}


// =====================================
// PARTÍCULAS
// =====================================

function criarParticulas(
  cor,
  quantidade
) {

  particles.innerHTML =
    "";


  if (
    !config.particulasAtivas
  ) {

    return;

  }


  for (
    let i = 0;
    i < quantidade;
    i++
  ) {

    const p =
      document.createElement(
        "div"
      );


    p.className =
      "particula";


    p.style.setProperty(

      "--particle-color",

      cor

    );


    p.style.left =

      (
        15 +
        Math.random() *
        70
      ) +
      "%";


    p.style.top =

      (
        30 +
        Math.random() *
        45
      ) +
      "%";


    p.style.animationDelay =

      (
        Math.random() *
        .8
      ) +
      "s";


    p.style.animationDuration =

      (
        1.5 +
        Math.random() *
        1.5
      ) +
      "s";


    particles.appendChild(
      p
    );

  }


  setTimeout(

    () => {

      particles.innerHTML =
        "";

    },

    4000

  );

}


// =====================================
// PARAR ÁUDIOS
// =====================================

function pararAudios() {

  if (
    audioMemeAtual
  ) {

    audioMemeAtual.pause();


    audioMemeAtual =
      null;

  }


  if (
    audioVozAtual
  ) {

    audioVozAtual.pause();


    audioVozAtual =
      null;

  }


  if (
    timeoutSeguranca
  ) {

    clearTimeout(
      timeoutSeguranca
    );


    timeoutSeguranca =
      null;

  }


  if (
    timeoutFechamento
  ) {

    clearTimeout(
      timeoutFechamento
    );


    timeoutFechamento =
      null;

  }

}


// =====================================
// FECHAR RESPEITANDO DURAÇÃO
// =====================================

function agendarFechamento() {

  const duracaoSegundos =

    Number(
      config.duracao
    ) ||
    12;


  const tempoMinimo =

    duracaoSegundos *
    1000;


  const passou =

    Date.now() -
    alertaMostradoEm;


  const restante =

    Math.max(

      0,

      tempoMinimo -
      passou

    );


  timeoutFechamento =

    setTimeout(

      esconderAlerta,

      restante

    );

}


// =====================================
// VOZ IA
// =====================================

async function tocarVoz(
  audioUrl
) {

  if (
    !config.vozAtiva ||
    !audioUrl
  ) {

    agendarFechamento();

    return;

  }


  try {

    audioVozAtual =
      new Audio(
        audioUrl
      );


    audioVozAtual.volume =

      Math.min(

        1,

        Math.max(

          0,

          Number(
            config.volumeVoz
          )

        )

      );


    audioVozAtual.onended =
      () => {

        audioVozAtual =
          null;


        agendarFechamento();

      };


    audioVozAtual.onerror =
      () => {

        audioVozAtual =
          null;


        agendarFechamento();

      };


    await audioVozAtual.play();


  } catch (error) {

    console.error(

      "Erro voz:",

      error

    );


    agendarFechamento();

  }

}


// =====================================
// MEME → VOZ
// =====================================

async function tocarMemeDepoisVoz(
  memeUrl,
  voiceUrl
) {

  if (
    !config.memesAtivos
  ) {

    tocarVoz(
      voiceUrl
    );

    return;

  }


  if (
    !memeUrl
  ) {

    tocarVoz(
      voiceUrl
    );

    return;

  }


  try {

    audioMemeAtual =
      new Audio(
        memeUrl
      );


    audioMemeAtual.volume =

      Math.min(

        1,

        Math.max(

          0,

          Number(
            config.volumeMeme
          )

        )

      );


    audioMemeAtual.onended =
      () => {


        if (
          timeoutSeguranca
        ) {

          clearTimeout(
            timeoutSeguranca
          );


          timeoutSeguranca =
            null;

        }


        audioMemeAtual =
          null;


        setTimeout(

          () => {

            tocarVoz(
              voiceUrl
            );

          },

          350

        );

      };


    audioMemeAtual.onerror =
      () => {

        audioMemeAtual =
          null;


        tocarVoz(
          voiceUrl
        );

      };


    await audioMemeAtual.play();


    timeoutSeguranca =

      setTimeout(

        () => {


          if (

            audioMemeAtual &&

            !audioMemeAtual.ended

          ) {

            audioMemeAtual.pause();


            audioMemeAtual =
              null;


            tocarVoz(
              voiceUrl
            );

          }


        },

        LIMITE_MEME

      );


  } catch (error) {

    console.error(

      "Erro meme:",

      error

    );


    tocarVoz(
      voiceUrl
    );

  }

}


// =====================================
// MOSTRAR ALERTA
// =====================================

function mostrarAlerta(
  data
) {

  if (
    alertaAtual
  ) {

    fila.push(
      data
    );


    return;

  }


  if (
    data.config
  ) {

    aplicarConfig(
      data.config
    );

  }


  alertaAtual =
    data;


  alertaMostradoEm =
    Date.now();


  const tier =
    data.tier ||
    "basic";


  const visual =
    configuracaoTier(
      tier
    );


  alerta.className =
    tier;


  iconeEl.textContent =
    visual.icone;


  categoriaEl.textContent =
    visual.categoria;


  nomeEl.textContent =

    limparTexto(
      data.name
    ) ||

    "Anônimo";


  valorEl.textContent =

    Number(
      data.amount
    )

      .toLocaleString(

        "pt-BR",

        {

          style:
            "currency",

          currency:
            "BRL"

        }

      );


  mensagemEl.textContent =

    limparTexto(
      data.message
    ) ||

    "Obrigado pelo apoio!";


  efeitoFlash(
    visual.flash
  );


  criarParticulas(

    visual.particles,

    visual.quantidade

  );


  alerta.classList.add(
    "mostrar"
  );


  const memeUrl =

    config.sons?.[tier] ||

    `/sounds/${tier}.mp3`;


  setTimeout(

    () => {

      tocarMemeDepoisVoz(

        memeUrl,

        data.audioUrl

      );

    },

    500

  );

}


// =====================================
// ESCONDER ALERTA
// =====================================

function esconderAlerta() {

  pararAudios();


  alerta.classList.remove(
    "mostrar"
  );


  alerta.classList.add(
    "saindo"
  );


  setTimeout(

    () => {

      alerta.classList.remove(
        "saindo"
      );


      alerta.className =
        "";


      alertaAtual =
        null;


      particles.innerHTML =
        "";


      if (
        fila.length >
        0
      ) {

        const proximo =
          fila.shift();


        mostrarAlerta(
          proximo
        );

      }


    },

    600

  );

}


// =====================================
// CONECTAR SSE
// =====================================

function conectarOverlay() {

  const source =

    new EventSource(
      "/api/overlay/stream"
    );


  source.onopen =
    () => {

      console.log(
        "Overlay conectado."
      );

    };


  source.onmessage =
    event => {

      try {

        const data =
          JSON.parse(
            event.data
          );


        // Servidor acabou de conectar.

        if (
          data.type ===
          "connected"
        ) {

          if (
            data.config
          ) {

            aplicarConfig(
              data.config
            );

          }


          return;

        }


        // Configuração alterada no painel.

        if (
          data.type ===
          "config"
        ) {

          aplicarConfig(
            data.config
          );


          return;

        }


        // Pix ou alerta de teste.

        if (
          data.type ===
          "donation"
        ) {

          mostrarAlerta(
            data
          );

        }


      } catch (error) {

        console.error(

          "Erro no evento:",

          error

        );

      }

    };


  source.onerror =
    () => {

      console.log(
        "Reconectando overlay..."
      );

    };

}


// =====================================
// INICIAR
// =====================================

async function iniciar() {

  await carregarConfig();


  conectarOverlay();

}


iniciar();


</script>
