<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KevenZL Pix Alertas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    #overlay {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 70px;

      pointer-events: none;
    }

    #alerta {
      position: relative;

      width: 720px;
      min-height: 210px;

      padding: 28px 38px;

      border-radius: 18px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(8, 8, 12, 0.97),
          rgba(20, 15, 28, 0.96)
        );

      border: 2px solid white;

      opacity: 0;

      transform:
        translateY(-80px)
        scale(0.82);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;

      overflow: hidden;
    }

    #alerta.mostrar {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }


    /* =========================
       BRILHO DE FUNDO
    ========================= */

    #alerta::before {
      content: "";

      position: absolute;
      inset: -100px;

      background:
        radial-gradient(
          circle,
          var(--glow) 0%,
          transparent 65%
        );

      opacity: 0.25;

      animation:
        respirar 1.5s ease-in-out infinite alternate;

      pointer-events: none;
    }


    /* =========================
       LINHA NEON
    ========================= */

    #alerta::after {
      content: "";

      position: absolute;

      left: 8%;
      right: 8%;
      bottom: 0;

      height: 3px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cor),
          white,
          var(--cor),
          transparent
        );

      box-shadow:
        0 0 12px var(--cor),
        0 0 25px var(--cor);

      animation:
        neonLinha 1.2s ease-in-out infinite alternate;
    }


    @keyframes respirar {
      from {
        transform: scale(0.9);
        opacity: 0.15;
      }

      to {
        transform: scale(1.2);
        opacity: 0.42;
      }
    }


    @keyframes neonLinha {
      from {
        opacity: 0.5;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes pulseNeon {
      0% {
        box-shadow:
          0 0 15px var(--cor),
          0 0 35px var(--glow);
      }

      100% {
        box-shadow:
          0 0 35px var(--cor),
          0 0 85px var(--glow);
      }
    }


    @keyframes legendaryPulse {
      0% {
        box-shadow:
          0 0 25px #ff1f35,
          0 0 50px rgba(255, 0, 30, 0.5);

        transform:
          translateY(0)
          scale(1);
      }

      100% {
        box-shadow:
          0 0 55px #ff1f35,
          0 0 120px rgba(255, 0, 30, 0.9);

        transform:
          translateY(0)
          scale(1.035);
      }
    }


    /* =========================
       CONTEÚDO
    ========================= */

    .conteudo {
      position: relative;
      z-index: 5;

      display: flex;
      align-items: center;

      gap: 25px;
    }


    .icone {
      width: 90px;
      height: 90px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      font-size: 48px;

      color: var(--cor);

      border:
        1px solid var(--cor);

      background:
        rgba(0, 0, 0, 0.35);

      box-shadow:
        0 0 18px var(--glow);

      animation:
        respirar 1.3s ease-in-out infinite alternate;
    }


    .texto {
      flex: 1;
    }


    .categoria {
      font-size: 14px;

      letter-spacing: 5px;

      font-weight: 800;

      color: var(--cor);

      margin-bottom: 5px;
    }


    .titulo {
      font-size: 16px;

      letter-spacing: 4px;

      font-weight: 800;

      color: rgba(255, 255, 255, 0.75);

      margin-bottom: 8px;
    }


    .nome {
      font-size: 30px;

      font-weight: 900;

      text-shadow:
        0 0 15px var(--glow);

      margin-bottom: 4px;
    }


    .valor {
      color: var(--cor);

      font-size: 34px;

      font-weight: 900;

      text-shadow:
        0 0 20px var(--glow);

      margin-bottom: 10px;
    }


    .mensagem {
      font-size: 21px;

      color: rgba(255, 255, 255, 0.9);

      line-height: 1.3;

      word-break: break-word;
    }


    .kevenzl {
      position: absolute;

      right: 22px;
      bottom: 10px;

      z-index: 6;

      font-style: italic;
      font-size: 15px;
      font-weight: 900;

      letter-spacing: 2px;

      color: var(--cor);

      opacity: 0.85;
    }


    /* =========================
       R$1 - 9,99
       PRETO / BRANCO
    ========================= */

    .basic {
      --cor: #ffffff;
      --glow: rgba(255, 255, 255, 0.35);

      border-color:
        rgba(255, 255, 255, 0.85);

      background:
        linear-gradient(
          135deg,
          rgba(5, 5, 5, 0.97),
          rgba(25, 25, 25, 0.96)
        );

      box-shadow:
        0 0 25px rgba(255, 255, 255, 0.18);
    }


    /* =========================
       R$10 - 24,99
       ROXO / ROSA
    ========================= */

    .medium {
      --cor: #d743ff;
      --glow: rgba(203, 44, 255, 0.75);

      border-color:
        #d743ff;

      box-shadow:
        0 0 30px rgba(203, 44, 255, 0.6);

      animation:
        pulseNeon 1.1s ease-in-out infinite alternate;
    }


    /* =========================
       R$25 - 49,99
       AZUL / ROXO
    ========================= */

    .epic {
      --cor: #5d7cff;
      --glow: rgba(55, 80, 255, 0.8);

      border-color:
        #5d7cff;

      background:
        linear-gradient(
          135deg,
          rgba(5, 8, 25, 0.97),
          rgba(15, 5, 35, 0.96)
        );

      animation:
        pulseNeon 0.85s ease-in-out infinite alternate;
    }


    /* =========================
       R$50 - 99,99
       DOURADO
    ========================= */

    .special {
      --cor: #ffb200;
      --glow: rgba(255, 145, 0, 0.9);

      border-color:
        #ffb200;

      background:
        linear-gradient(
          135deg,
          rgba(20, 10, 0, 0.98),
          rgba(40, 18, 0, 0.96)
        );

      animation:
        pulseNeon 0.65s ease-in-out infinite alternate;
    }


    /* =========================
       R$100+
       LENDÁRIO VERMELHO
    ========================= */

    .legendary {
      --cor: #ff253a;
      --glow: rgba(255, 0, 30, 0.95);

      width: 850px;

      border-color:
        #ff253a;

      background:
        linear-gradient(
          135deg,
          rgba(10, 0, 2, 0.98),
          rgba(45, 0, 5, 0.97)
        );

      animation:
        legendaryPulse
        0.6s ease-in-out
        infinite alternate;
    }


    .legendary .icone {
      font-size: 58px;

      width: 105px;
      height: 105px;
    }


    .legendary .nome {
      font-size: 36px;
    }


    .legendary .valor {
      font-size: 42px;
    }

  </style>
</head>


<body>

  <div id="overlay">

    <div id="alerta">

      <div class="conteudo">

        <div
          id="icone"
          class="icone"
        >
          $
        </div>


        <div class="texto">

          <div
            id="categoria"
            class="categoria"
          >
            BÁSICO
          </div>


          <div class="titulo">
            NOVO PIX
          </div>


          <div
            id="nome"
            class="nome"
          >
            Keven
          </div>


          <div
            id="valor"
            class="valor"
          >
            R$ 5,00
          </div>


          <div
            id="mensagem"
            class="mensagem"
          >
            Obrigado pelo apoio!
          </div>

        </div>

      </div>


      <div class="kevenzl">
        KEVENZL
      </div>

    </div>

  </div>


  <script>

    const alerta =
      document.getElementById("alerta");

    const nomeEl =
      document.getElementById("nome");

    const valorEl =
      document.getElementById("valor");

    const mensagemEl =
      document.getElementById("mensagem");

    const iconeEl =
      document.getElementById("icone");

    const categoriaEl =
      document.getElementById("categoria");


    let alertaAtual = null;

    let fila = [];

    let audioMemeAtual = null;

    let audioVozAtual = null;

    let timeoutSeguranca = null;

    let timeoutFechamento = null;

    let alertaMostradoEm = 0;


    const TEMPO_MINIMO_ALERTA =
      12000;


    const LIMITE_MEME =
      30000;


    function limparTexto(texto) {

      if (!texto) {
        return "";
      }


      return String(texto)

        .replace(
          /(https?:\/\/[^\s]+)/gi,
          ""
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim()

        .slice(
          0,
          250
        );
    }


    function configuracaoTier(tier) {

      const config = {

        basic: {

          icone:
            "💰",

          categoria:
            "BÁSICO",

          som:
            "/sounds/basico.mp3"
        },


        medium: {

          icone:
            "💎",

          categoria:
            "DESTACADO",

          som:
            "/sounds/medio.mp3"
        },


        epic: {

          icone:
            "🔥",

          categoria:
            "ÉPICO",

          som:
            "/sounds/epico.mp3"
        },


        special: {

          icone:
            "🏆",

          categoria:
            "ESPECIAL",

          som:
            "/sounds/especial.mp3"
        },


        legendary: {

          icone:
            "👑",

          categoria:
            "LENDÁRIO",

          som:
            "/sounds/lendario.mp3"
        }

      };


      return (
        config[tier] ||
        config.basic
      );
    }


    function pararAudios() {

      if (audioMemeAtual) {

        audioMemeAtual.pause();

        audioMemeAtual.currentTime =
          0;

        audioMemeAtual =
          null;
      }


      if (audioVozAtual) {

        audioVozAtual.pause();

        audioVozAtual.currentTime =
          0;

        audioVozAtual =
          null;
      }


      if (timeoutSeguranca) {

        clearTimeout(
          timeoutSeguranca
        );

        timeoutSeguranca =
          null;
      }


      if (timeoutFechamento) {

        clearTimeout(
          timeoutFechamento
        );

        timeoutFechamento =
          null;
      }
    }


    function agendarFechamento() {

      if (timeoutFechamento) {

        clearTimeout(
          timeoutFechamento
        );
      }


      const tempoPassado =
        Date.now() -
        alertaMostradoEm;


      const restante =
        Math.max(
          0,
          TEMPO_MINIMO_ALERTA -
          tempoPassado
        );


      timeoutFechamento =
        setTimeout(
          esconderAlerta,
          restante
        );
    }


    async function tocarVoz(audioUrl) {

      if (!audioUrl) {

        agendarFechamento();

        return;
      }


      try {

        audioVozAtual =
          new Audio(
            audioUrl
          );


        audioVozAtual.volume =
          1;


        audioVozAtual.onended =
          () => {

            audioVozAtual =
              null;

            agendarFechamento();
          };


        audioVozAtual.onerror =
          () => {

            audioVozAtual =
              null;

            agendarFechamento();
          };


        await audioVozAtual.play();


      } catch (error) {

        console.error(
          "Erro ao reproduzir voz:",
          error
        );


        agendarFechamento();
      }
    }


    async function tocarMemeDepoisVoz(
      memeUrl,
      voiceUrl
    ) {

      try {

        audioMemeAtual =
          new Audio(
            memeUrl
          );


        audioMemeAtual.volume =
          1;


        audioMemeAtual.onended =
          () => {

            if (timeoutSeguranca) {

              clearTimeout(
                timeoutSeguranca
              );

              timeoutSeguranca =
                null;
            }


            audioMemeAtual =
              null;


            setTimeout(
              () => {

                tocarVoz(
                  voiceUrl
                );

              },
              350
            );
          };


        audioMemeAtual.onerror =
          () => {

            audioMemeAtual =
              null;


            tocarVoz(
              voiceUrl
            );
          };


        await audioMemeAtual.play();


        timeoutSeguranca =
          setTimeout(
            () => {

              if (
                audioMemeAtual &&
                !audioMemeAtual.ended
              ) {

                audioMemeAtual.pause();

                audioMemeAtual =
                  null;


                tocarVoz(
                  voiceUrl
                );
              }

            },
            LIMITE_MEME
          );


      } catch (error) {

        console.error(
          "Erro ao reproduzir meme:",
          error
        );


        tocarVoz(
          voiceUrl
        );
      }
    }


    function mostrarAlerta(data) {

      if (alertaAtual) {

        fila.push(
          data
        );

        return;
      }


      alertaAtual =
        data;


      alertaMostradoEm =
        Date.now();


      const tier =
        data.tier ||
        "basic";


      const config =
        configuracaoTier(
          tier
        );


      alerta.className =
        tier;


      iconeEl.textContent =
        config.icone;


      categoriaEl.textContent =
        config.categoria;


      nomeEl.textContent =
        limparTexto(
          data.name
        ) ||
        "Anônimo";


      valorEl.textContent =
        Number(
          data.amount
        )
        .toLocaleString(
          "pt-BR",
          {
            style: "currency",
            currency: "BRL"
          }
        );


      mensagemEl.textContent =
        limparTexto(
          data.message
        ) ||
        "Obrigado pelo apoio!";


      alerta.classList.add(
        "mostrar"
      );


      setTimeout(
        () => {

          tocarMemeDepoisVoz(
            config.som,
            data.audioUrl
          );

        },
        500
      );
    }


    function esconderAlerta() {

      pararAudios();


      alerta.classList.remove(
        "mostrar"
      );


      setTimeout(
        () => {

          alertaAtual =
            null;


          if (
            fila.length > 0
          ) {

            const proximo =
              fila.shift();


            mostrarAlerta(
              proximo
            );
          }

        },
        600
      );
    }


    function conectarOverlay() {

      const source =
        new EventSource(
          "/api/overlay/stream"
        );


      source.onmessage =
        event => {

          try {

            const data =
              JSON.parse(
                event.data
              );


            if (
              data.type ===
              "donation"
            ) {

              mostrarAlerta(
                data
              );
            }


          } catch (error) {

            console.error(
              error
            );
          }
        };
    }


    conectarOverlay();

  </script>

</body>
</html>
