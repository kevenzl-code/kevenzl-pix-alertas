<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KevenZL Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}
#alert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;
  min-width:420px;max-width:80%;padding:24px;border-radius:18px;background:rgba(15,10,28,.94);
  border:2px solid #9b6cff;box-shadow:0 0 40px rgba(124,58,237,.45);color:#fff;text-align:center;
  transition:.35s ease}
#alert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#amount{font-size:34px;font-weight:800;color:#c7a7ff}
#name{font-size:24px;font-weight:700;margin-top:8px}
#message{font-size:20px;margin-top:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="alert">
  <div id="amount"></div>
  <div id="name"></div>
  <div id="message"></div>
</div>
<script>
const box=document.getElementById("alert");
const amount=document.getElementById("amount");
const nameEl=document.getElementById("name");
const message=document.getElementById("message");
let hideTimer;

function beep(tier){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const freq={basic:440,medium:520,epic:660,special:780,legendary:920}[tier]||440;
  osc.frequency.value=freq;
  osc.type="sine";
  gain.gain.setValueAtTime(.001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+.65);
}

function show(d){
  amount.textContent=`R$ ${Number(d.amount).toFixed(2).replace(".",",")}`;
  nameEl.textContent=d.name||"Anônimo";
  message.textContent=d.message||"";
  box.classList.add("show");
  beep(d.tier);
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>box.classList.remove("show"),7000);
}

const source=new EventSource("/api/overlay/stream");
source.onmessage=(event)=>{
  try{
    const d=JSON.parse(event.data);
    if(d.type==="donation") show(d);
  }catch{}
};
</script>
</body>
</html>
