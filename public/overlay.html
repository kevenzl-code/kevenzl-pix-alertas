<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KevenZL Overlay</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 80px;
      pointer-events: none;
    }

    #alerta {
      min-width: 500px;
      max-width: 800px;
      padding: 24px 32px;
      border-radius: 20px;
      background: rgba(12, 8, 25, 0.94);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: white;

      opacity: 0;
      transform: translateY(-70px) scale(0.85);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    #alerta.mostrar {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .emoji {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .titulo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .nome {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .valor {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .mensagem {
      font-size: 24px;
      line-height: 1.3;
      word-break: break-word;
    }

    .basic {
      border-color: #a970ff;
      box-shadow: 0 0 30px rgba(169, 112, 255, 0.55);
    }

    .basic .nome,
    .basic .valor {
      color: #bb86fc;
    }

    .medium {
      border-color: #00bfff;
      box-shadow: 0 0 35px rgba(0, 191, 255, 0.65);
    }

    .medium .nome,
    .medium .valor {
      color: #4fd5ff;
    }

    .epic {
      border-color: #ff00ff;
      box-shadow: 0 0 45px rgba(255, 0, 255, 0.75);
    }

    .epic .nome,
    .epic .valor {
      color: #ff5cff;
    }

    .special {
      border-color: #ff9500;
      box-shadow: 0 0 55px rgba(255, 149, 0, 0.85);
      animation: specialGlow 1s infinite alternate;
    }

    .special .nome,
    .special .valor {
      color: #ffb347;
    }

    .legendary {
      border-color: #ffd700;
      box-shadow: 0 0 70px rgba(255, 215, 0, 1);
      animation: legendaryGlow 0.6s infinite alternate;
    }

    .legendary .nome,
    .legendary .valor {
      color: #ffd700;
    }

    @keyframes specialGlow {
      from {
        box-shadow: 0 0 25px rgba(255, 149, 0, 0.5);
      }

      to {
        box-shadow: 0 0 65px rgba(255, 149, 0, 1);
      }
    }

    @keyframes legendaryGlow {
      from {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
      }

      to {
        transform: translateY(0) scale(1.04);
        box-shadow: 0 0 90px rgba(255, 215, 0, 1);
      }
    }
  </style>
</head>

<body>

  <div id="overlay">
    <div id="alerta">

      <div id="emoji" class="emoji">
        💜
      </div>

      <div id="titulo" class="titulo">
        NOVA DOAÇÃO
      </div>

      <div id="nome" class="nome">
        Keven
      </div>

      <div id="valor" class="valor">
        R$ 10,00
      </div>

      <div id="mensagem" class="mensagem">
        Teste
      </div>

    </div>
  </div>


  <script>

    const alerta =
      document.getElementById("alerta");

    const nomeEl =
      document.getElementById("nome");

    const valorEl =
      document.getElementById("valor");

    const mensagemEl =
      document.getElementById("mensagem");

    const emojiEl =
      document.getElementById("emoji");

    const tituloEl =
      document.getElementById("titulo");


    let alertaAtual = null;
    let fila = [];

    let audioMemeAtual = null;
    let audioVozAtual = null;

    let timeoutSeguranca = null;


    function limparTexto(texto) {
      if (!texto) {
        return "";
      }

      return String(texto)
        .replace(/(https?:\/\/[^\s]+)/gi, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 250);
    }


    function configuracaoTier(tier) {
      const config = {

        basic: {
          emoji: "💜",
          titulo: "NOVA DOAÇÃO",
          som: "/sounds/basico.mp3"
        },

        medium: {
          emoji: "💙",
          titulo: "DOAÇÃO!",
          som: "/sounds/medio.mp3"
        },

        epic: {
          emoji: "💥",
          titulo: "DOAÇÃO ÉPICA!",
          som: "/sounds/epico.mp3"
        },

        special: {
          emoji: "🔥",
          titulo: "DOAÇÃO ESPECIAL!",
          som: "/sounds/especial.mp3"
        },

        legendary: {
          emoji: "👑",
          titulo: "DOAÇÃO LENDÁRIA!",
          som: "/sounds/lendario.mp3"
        }
      };

      return config[tier] || config.basic;
    }


    function pararAudios() {

      if (audioMemeAtual) {
        audioMemeAtual.pause();
        audioMemeAtual.currentTime = 0;
        audioMemeAtual = null;
      }

      if (audioVozAtual) {
        audioVozAtual.pause();
        audioVozAtual.currentTime = 0;
        audioVozAtual = null;
      }

      if (timeoutSeguranca) {
        clearTimeout(timeoutSeguranca);
        timeoutSeguranca = null;
      }
    }


    async function tocarVoz(audioUrl) {

      if (!audioUrl) {
        console.log(
          "Alerta chegou sem áudio da ElevenLabs."
        );

        esconderAlerta();
        return;
      }

      try {

        audioVozAtual =
          new Audio(audioUrl);

        audioVozAtual.volume =
          1;

        audioVozAtual.onended =
          () => {
            esconderAlerta();
          };

        audioVozAtual.onerror =
          () => {
            console.error(
              "Erro ao carregar voz da ElevenLabs."
            );

            esconderAlerta();
          };

        await audioVozAtual.play();

        console.log(
          "Voz ElevenLabs reproduzida."
        );

      } catch (error) {

        console.error(
          "Erro ao reproduzir voz:",
          error
        );

        esconderAlerta();
      }
    }


    async function tocarMemeDepoisVoz(
      memeUrl,
      voiceUrl
    ) {

      try {

        audioMemeAtual =
          new Audio(memeUrl);

        audioMemeAtual.volume =
          1;


        audioMemeAtual.onended =
          () => {

            audioMemeAtual = null;

            setTimeout(
              () => {
                tocarVoz(voiceUrl);
              },
              350
            );
          };


        audioMemeAtual.onerror =
          () => {

            console.error(
              "Erro ao carregar meme:",
              memeUrl
            );

            tocarVoz(
              voiceUrl
            );
          };


        await audioMemeAtual.play();

        console.log(
          "Meme reproduzindo:",
          memeUrl
        );


        // Segurança:
        // se algum MP3 travar,
        // continua para a voz depois de 20s

        timeoutSeguranca =
          setTimeout(
            () => {

              if (
                audioMemeAtual &&
                !audioMemeAtual.ended
              ) {

                audioMemeAtual.pause();

                audioMemeAtual = null;

                tocarVoz(
                  voiceUrl
                );
              }

            },
            20000
          );


      } catch (error) {

        console.error(
          "Erro ao reproduzir meme:",
          error
        );

        tocarVoz(
          voiceUrl
        );
      }
    }


    function mostrarAlerta(data) {

      if (alertaAtual) {

        fila.push(data);

        return;
      }


      alertaAtual = data;


      const tier =
        data.tier ||
        "basic";


      const config =
        configuracaoTier(
          tier
        );


      alerta.className =
        tier;


      emojiEl.textContent =
        config.emoji;


      tituloEl.textContent =
        config.titulo;


      nomeEl.textContent =
        limparTexto(
          data.name
        ) ||
        "Anônimo";


      valorEl.textContent =
        Number(data.amount)
          .toLocaleString(
            "pt-BR",
            {
              style: "currency",
              currency: "BRL"
            }
          );


      mensagemEl.textContent =
        limparTexto(
          data.message
        ) ||
        "Obrigado pela doação!";


      alerta.classList.add(
        "mostrar"
      );


      setTimeout(
        () => {

          tocarMemeDepoisVoz(
            config.som,
            data.audioUrl
          );

        },
        500
      );
    }


    function esconderAlerta() {

      pararAudios();


      alerta.classList.remove(
        "mostrar"
      );


      setTimeout(
        () => {

          alertaAtual = null;


          if (fila.length > 0) {

            const proximo =
              fila.shift();


            mostrarAlerta(
              proximo
            );
          }

        },
        600
      );
    }


    function conectarOverlay() {

      const source =
        new EventSource(
          "/api/overlay/stream"
        );


      source.onopen =
        () => {

          console.log(
            "Overlay conectado."
          );
        };


      source.onmessage =
        event => {

          try {

            const data =
              JSON.parse(
                event.data
              );


            if (
              data.type ===
              "connected"
            ) {

              console.log(
                "Conectado ao servidor."
              );

              return;
            }


            if (
              data.type ===
              "donation"
            ) {

              console.log(
                "Doação recebida:",
                data
              );


              mostrarAlerta(
                data
              );
            }


          } catch (error) {

            console.error(
              "Erro no alerta:",
              error
            );
          }
        };


      source.onerror =
        () => {

          console.log(
            "Conexão perdida. Reconectando..."
          );
        };
    }


    conectarOverlay();

  </script>

</body>
</html>
