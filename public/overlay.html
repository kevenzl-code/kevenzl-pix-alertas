<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>KevenZL Overlay</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 80px;
      pointer-events: none;
    }

    #alerta {
      min-width: 500px;
      max-width: 800px;
      padding: 24px 32px;
      border-radius: 20px;
      background: rgba(12, 8, 25, 0.94);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: white;
      opacity: 0;
      transform: translateY(-70px) scale(0.85);
      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    #alerta.mostrar {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .titulo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .nome {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .valor {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .mensagem {
      font-size: 24px;
      line-height: 1.3;
      word-break: break-word;
    }

    .emoji {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .basic {
      border-color: #a970ff;
      box-shadow: 0 0 30px rgba(169, 112, 255, 0.55);
    }

    .basic .nome,
    .basic .valor {
      color: #bb86fc;
    }

    .medium {
      border-color: #00bfff;
      box-shadow: 0 0 35px rgba(0, 191, 255, 0.65);
    }

    .medium .nome,
    .medium .valor {
      color: #4fd5ff;
    }

    .epic {
      border-color: #ff00ff;
      box-shadow: 0 0 45px rgba(255, 0, 255, 0.75);
    }

    .epic .nome,
    .epic .valor {
      color: #ff5cff;
    }

    .special {
      border-color: #ff9500;
      box-shadow: 0 0 55px rgba(255, 149, 0, 0.85);
      animation: specialGlow 1s infinite alternate;
    }

    .special .nome,
    .special .valor {
      color: #ffb347;
    }

    .legendary {
      border-color: #ffd700;
      box-shadow: 0 0 70px rgba(255, 215, 0, 1);
      animation: legendaryGlow 0.6s infinite alternate;
    }

    .legendary .nome,
    .legendary .valor {
      color: #ffd700;
    }

    @keyframes specialGlow {
      from {
        box-shadow: 0 0 25px rgba(255, 149, 0, 0.5);
      }

      to {
        box-shadow: 0 0 65px rgba(255, 149, 0, 1);
      }
    }

    @keyframes legendaryGlow {
      from {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
      }

      to {
        transform: translateY(0) scale(1.04);
        box-shadow: 0 0 90px rgba(255, 215, 0, 1);
      }
    }
  </style>
</head>

<body>

  <div id="overlay">
    <div id="alerta">

      <div id="emoji" class="emoji">
        💜
      </div>

      <div id="titulo" class="titulo">
        NOVA DOAÇÃO
      </div>

      <div id="nome" class="nome">
        Keven
      </div>

      <div id="valor" class="valor">
        R$ 10,00
      </div>

      <div id="mensagem" class="mensagem">
        Teste
      </div>

    </div>
  </div>

  <script>
    const alerta =
      document.getElementById("alerta");

    const nomeEl =
      document.getElementById("nome");

    const valorEl =
      document.getElementById("valor");

    const mensagemEl =
      document.getElementById("mensagem");

    const emojiEl =
      document.getElementById("emoji");

    const tituloEl =
      document.getElementById("titulo");


    let alertaAtual = null;
    let fila = [];
    let audioAtual = null;


    function limparTexto(texto) {
      if (!texto) {
        return "";
      }

      return String(texto)
        .replace(
          /(https?:\/\/[^\s]+)/gi,
          ""
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim()
        .slice(0, 250);
    }


    function configuracaoTier(tier) {
      const config = {
        basic: {
          emoji: "💜",
          titulo: "NOVA DOAÇÃO"
        },

        medium: {
          emoji: "💙",
          titulo: "DOAÇÃO!"
        },

        epic: {
          emoji: "💥",
          titulo: "DOAÇÃO ÉPICA!"
        },

        special: {
          emoji: "🔥",
          titulo: "DOAÇÃO ESPECIAL!"
        },

        legendary: {
          emoji: "👑",
          titulo: "DOAÇÃO LENDÁRIA!"
        }
      };

      return config[tier] || config.basic;
    }


    function tocarSomCurto(tier) {
      try {
        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        const audio =
          new AudioContext();

        const oscillator =
          audio.createOscillator();

        const gain =
          audio.createGain();

        oscillator.connect(gain);
        gain.connect(audio.destination);

        let frequencia = 500;
        let duracao = 0.25;

        if (tier === "medium") {
          frequencia = 650;
        }

        if (tier === "epic") {
          frequencia = 800;
        }

        if (tier === "special") {
          frequencia = 950;
        }

        if (tier === "legendary") {
          frequencia = 1200;
          duracao = 0.4;
        }

        oscillator.frequency.value =
          frequencia;

        oscillator.type =
          "sine";

        gain.gain.setValueAtTime(
          0.15,
          audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audio.currentTime + duracao
        );

        oscillator.start();

        oscillator.stop(
          audio.currentTime + duracao
        );

      } catch (error) {
        console.log(
          "Não foi possível tocar o som curto.",
          error
        );
      }
    }


    async function tocarVoz(audioUrl) {
      if (!audioUrl) {
        console.log(
          "Alerta chegou sem áudio da ElevenLabs."
        );

        return;
      }

      try {
        if (audioAtual) {
          audioAtual.pause();
          audioAtual = null;
        }

        audioAtual =
          new Audio(audioUrl);

        audioAtual.volume =
          1;

        await audioAtual.play();

        console.log(
          "Voz ElevenLabs reproduzida."
        );

      } catch (error) {
        console.error(
          "Erro ao reproduzir voz:",
          error
        );
      }
    }


    function mostrarAlerta(data) {
      if (alertaAtual) {
        fila.push(data);
        return;
      }

      alertaAtual = data;

      const tier =
        data.tier || "basic";

      const config =
        configuracaoTier(tier);

      alerta.className =
        tier;

      emojiEl.textContent =
        config.emoji;

      tituloEl.textContent =
        config.titulo;

      nomeEl.textContent =
        limparTexto(data.name) ||
        "Anônimo";

      valorEl.textContent =
        Number(data.amount)
          .toLocaleString(
            "pt-BR",
            {
              style: "currency",
              currency: "BRL"
            }
          );

      mensagemEl.textContent =
        limparTexto(data.message) ||
        "Obrigado pela doação!";


      tocarSomCurto(tier);

      alerta.classList.add(
        "mostrar"
      );


      setTimeout(
        () => {
          tocarVoz(
            data.audioUrl
          );
        },
        600
      );


      setTimeout(
        esconderAlerta,
        12000
      );
    }


    function esconderAlerta() {
      alerta.classList.remove(
        "mostrar"
      );

      setTimeout(
        () => {
          alertaAtual = null;

          if (fila.length > 0) {
            const proximo =
              fila.shift();

            mostrarAlerta(
              proximo
            );
          }
        },
        600
      );
    }


    function conectarOverlay() {
      const source =
        new EventSource(
          "/api/overlay/stream"
        );

      source.onopen =
        () => {
          console.log(
            "Overlay conectado."
          );
        };

      source.onmessage =
        event => {
          try {
            const data =
              JSON.parse(
                event.data
              );

            if (
              data.type ===
              "connected"
            ) {
              console.log(
                "Conectado ao servidor."
              );

              return;
            }

            if (
              data.type ===
              "donation"
            ) {
              console.log(
                "Doação recebida:",
                data
              );

              mostrarAlerta(
                data
              );
            }

          } catch (error) {
            console.error(
              "Erro no alerta:",
              error
            );
          }
        };

      source.onerror =
        () => {
          console.log(
            "Conexão perdida. O navegador tentará reconectar."
          );
        };
    }


    conectarOverlay();
  </script>

</body>
</html>
